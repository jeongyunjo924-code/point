<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="only light" />
<meta name="theme-color" content="#FBF7F0" />
<title>점의 이동 시뮬레이션</title>
<style>
  * { box-sizing: border-box; }
  html { color-scheme: only light; }
  html, body {
    margin: 0; padding: 0;
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    display: flex; flex-direction: column;
    background: #FBF7F0;
    color: #2B2A28;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    padding: 12px 14px;
    padding:
      max(env(safe-area-inset-top), clamp(8px, 1.5vh, 16px))
      max(env(safe-area-inset-right), clamp(10px, 2vw, 20px))
      max(env(safe-area-inset-bottom), clamp(8px, 1.5vh, 16px))
      max(env(safe-area-inset-left), clamp(10px, 2vw, 20px));
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 1100px;
    max-width: min(1100px, 100%);
    width: 100%;
    margin: 0 auto;
    height: 100%;
    min-height: 0;
    display: flex; flex-direction: column;
  }
  .title {
    font-size: 20px;
    font-size: clamp(16px, 2.4vh, 24px);
    font-weight: 800; margin: 0; color: #1F4B3F; flex-shrink: 0;
  }
  .subtitle {
    margin: 2px 0 8px; color: #6B6459;
    font-size: 13px;
    font-size: clamp(11px, 1.4vh, 14px); flex-shrink: 0;
  }
  @media (max-width: 600px) { .subtitle { display: none; } }
  .btn {
    padding: 9px 14px; min-height: 38px;
    border-radius: 10px; border: 2px solid #DDD5C4;
    background: #fff; color: #2B2A28;
    font-weight: 700; font-size: 13px; font-family: inherit;
    cursor: pointer;
    -webkit-appearance: none; appearance: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .btn:active { transform: scale(0.96); }
  .btn.on-green { background: #1F4B3F; color: #fff; border-color: #1F4B3F; }
  .btn.on-orange { background: #C1622D; color: #fff; border-color: #C1622D; }
  .btn.pill { padding: 8px 14px; min-height: 36px; border-radius: 999px; }
  .btn.small { padding: 6px 12px; min-height: 32px; font-size: 12px; }
  .btn.solid { background: #1F4B3F; color: #fff; border-color: #1F4B3F; }
  .btn.main { flex: 1; font-size: 15px; padding: 9px 0; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.main:disabled { opacity: 0.5; }

  .shape-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; flex-shrink: 0; }

  .draw-bar {
    margin-bottom: 8px; padding: 6px 12px;
    background: #FFF3E9; border: 1px solid #F0D3B8; border-radius: 10px;
    font-size: 12px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 6px; flex-shrink: 0;
  }
  .draw-bar[hidden] { display: none; }
  .draw-actions { display: flex; gap: 6px; }

  .panels {
    display: flex; justify-content: center; align-items: center;
    flex: 1; min-height: 0; min-width: 0; overflow: hidden; gap: 8px;
  }
  .panel { flex: none; display: flex; flex-direction: column; align-items: center; }
  .panel-title {
    font-weight: 800; font-size: 14px; line-height: 20px; height: 20px;
    margin-bottom: 2px; text-align: center;
  }
  .grid-svg { background: #fff; border-radius: 12px; display: block; }

  .controls {
    margin-top: 8px; flex-shrink: 0;
    background: #fff; border: 1px solid #EBE4D6; border-radius: 12px; padding: 10px;
  }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .label { width: 40px; font-weight: 700; color: #6B6459; font-size: 13px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions { display: flex; gap: 8px; margin-top: 6px; }

  .status {
    margin-top: 6px; flex-shrink: 0; padding: 8px 14px;
    background: #F0F5F2; border: 1px solid #D7E5DE; border-radius: 10px;
    font-size: 13px;
    font-size: clamp(12px, 1.6vh, 14px); font-weight: 600; color: #1F4B3F;
    text-align: center;
  }

  /* 화면 높이가 낮을 때(폰 가로 등): 제목을 숨기고 여백·버튼을 줄여 한 화면에 맞춤 */
  @media (max-height: 480px) {
    .title, .subtitle { display: none; }
    .btn { min-height: 30px; padding: 5px 10px; font-size: 12px; }
    .btn.pill { min-height: 30px; padding: 5px 12px; }
    .btn.small { min-height: 28px; padding: 4px 10px; }
    .btn.main { padding: 5px 0; }
    .shape-btns { margin-bottom: 4px; }
    .draw-bar { margin-bottom: 4px; padding: 4px 10px; }
    .controls { margin-top: 4px; padding: 6px 8px; display: flex; flex-wrap: wrap; column-gap: 12px; }
    .controls .row { margin-bottom: 4px; }
    .controls .actions { flex: 1 1 100%; margin-top: 2px; }
    .status { margin-top: 4px; padding: 5px 10px; }
  }
  /* 세로로 든 작은 폰(예: 320x568): 여백·버튼을 줄이고, 도형을 그리는 동안은 조작 버튼을 숨겨 격자판 공간 확보 */
  @media (max-width: 600px) and (max-height: 700px) and (orientation: portrait) {
    .btn { min-height: 32px; padding: 6px 10px; font-size: 12px; }
    .btn.pill { min-height: 32px; padding: 6px 12px; }
    .btn.small { min-height: 28px; padding: 4px 10px; }
    .btn.main { padding: 6px 0; }
    .btns .btn { min-width: 0 !important; }
    .shape-btns { margin-bottom: 6px; }
    .draw-bar { margin-bottom: 6px; padding: 4px 10px; }
    .controls { margin-top: 6px; padding: 8px; }
    .row { margin-bottom: 4px; }
    .status { margin-top: 4px; padding: 6px 10px; }
    .drawing-active .controls { display: none; }
  }
  @media (max-width: 360px) and (orientation: portrait) {
    .btns { gap: 4px; }
    .btns .btn { padding: 6px 6px; }
    .label { width: 32px; }
    .row { gap: 6px; }
  }
  @media (max-height: 620px) and (orientation: portrait) { .title { display: none; } }
  /* 폰 가로 모드: 조작 버튼을 오른쪽 열로 옮겨 격자판을 최대한 크게 */
  @media (max-height: 480px) and (orientation: landscape) {
    .wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      column-gap: 8px;
    }
    .shape-btns { grid-column: 1; grid-row: 1; }
    .draw-bar { grid-column: 1; grid-row: 2; }
    .panels { grid-column: 1; grid-row: 3; }
    .controls { grid-column: 2; grid-row: 1 / span 3; margin-top: 0; display: block; overflow: hidden; align-self: start; }
    .status { grid-column: 1 / span 2; grid-row: 4; }
    .btn.pill { padding: 5px 9px; }
    .draw-bar { font-size: 11px; }
    .drawing-active .wrap { grid-template-columns: minmax(0, 1fr); }
    .drawing-active .controls { display: none; }
    .drawing-active .status { grid-column: 1; }
  }
  @media (max-height: 480px) and (max-width: 640px) and (orientation: landscape) {
    .wrap { grid-template-columns: minmax(0, 1fr) 210px; }
  }

  /* flex gap 미지원 브라우저(iOS 14.4 이하 등)용 여백 대체 */
  .no-flex-gap .shape-btns > *, .no-flex-gap .btns > *, .no-flex-gap .draw-actions > * { margin: 0 6px 6px 0; }
  .no-flex-gap .row > * { margin-right: 8px; }
  .no-flex-gap .row > .btns { margin-right: 0; }
  .no-flex-gap .actions > * + * { margin-left: 8px; }
  .no-flex-gap .draw-bar > * { margin-right: 6px; }
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <h1 class="title">점의 이동 시뮬레이션</h1>
    <p class="subtitle">점의 위치를 고르거나 직접 찍은 뒤, 이동 전과 이동 후의 모습을 비교해보세요.</p>

    <div class="shape-btns" id="shapeBtns"></div>

    <div class="draw-bar" id="drawBar" hidden>
      <span id="drawMsg"></span>
      <div class="draw-actions">
        <button class="btn small solid" id="finishBtn">점 완성</button>
        <button class="btn small" id="clearBtn">다시 찍기</button>
      </div>
    </div>

    <div class="panels" id="panels">
      <div class="panel" id="panelL">
        <div class="panel-title" style="color:#1F4B3F">이동 전</div>
        <svg class="grid-svg" id="svgL" style="border:2px solid #1F4B3F33"></svg>
      </div>
      <div class="panel" id="panelR">
        <div class="panel-title" style="color:#C1622D">이동 후</div>
        <svg class="grid-svg" id="svgR" style="border:2px solid #C1622D33"></svg>
      </div>
    </div>

    <div class="controls">
      <div class="row"><span class="label">방향</span><div class="btns" id="dirBtns"></div></div>
      <div class="row"><span class="label">거리</span><div class="btns" id="distBtns"></div></div>
      <div class="actions">
        <button class="btn main solid" id="actionBtn">이동하기</button>
        <button class="btn" id="resetBtn" style="padding:9px 18px">초기화</button>
      </div>
    </div>

    <div class="status" id="status"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // flex gap 미지원 브라우저 감지 → 여백을 margin으로 대체
  (function () {
    var f = document.createElement('div');
    f.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';
    f.appendChild(document.createElement('div'));
    f.appendChild(document.createElement('div'));
    document.body.appendChild(f);
    var ok = f.scrollHeight === 1;
    document.body.removeChild(f);
    if (!ok) document.documentElement.className += ' no-flex-gap';
  })();

  // ---------- 격자 설정 ----------
  var GRID_SIZE = 12;               // 12 x 12 칸
  var CELL = 28;                    // 칸 하나(viewBox 단위)
  var PAD = 20;
  var SVG_SIZE = GRID_SIZE * CELL + PAD * 2;
  var NS = 'http://www.w3.org/2000/svg';

  function toPx(p) { return { x: PAD + p.x * CELL, y: PAD + p.y * CELL }; }

  // ---------- 처음 점 (격자 교차점 좌표) ----------
  var PRESETS = {
    '가운데 점': { x: 6, y: 6 },
    '왼쪽 아래 점': { x: 3, y: 9 },
    '오른쪽 위 점': { x: 9, y: 3 }
  };
  var DRAW = '직접 찍기';
  var DIRS = [
    { key: 'up',    label: '↑ 위쪽',   name: '위쪽',   dx: 0,  dy: -1 },
    { key: 'down',  label: '↓ 아래쪽', name: '아래쪽', dx: 0,  dy: 1 },
    { key: 'left',  label: '← 왼쪽',   name: '왼쪽',   dx: -1, dy: 0 },
    { key: 'right', label: '→ 오른쪽', name: '오른쪽', dx: 1,  dy: 0 }
  ];
  var DISTS = [1, 2, 3, 4, 5, 6];
  var DEFAULT_STATUS = "점의 위치를 고르고 '이동하기'를 눌러보세요.";

  // ---------- 상태 ----------
  var state = {
    pointName: '가운데 점',
    customPoint: null,
    drawingMode: false,
    direction: 'right',
    dist: 3,
    segs: [],                 // 끝난 이동들 [{from, to, dist}]
    cur: null,                // 이동 후 현재 점 (이동이 한 번이라도 있을 때)
    anim: null,               // 진행 중인 이동 {from, d}
    moved: 0,                 // 진행 중인 이동에서 지금까지 간 칸 수 (소수)
    status: DEFAULT_STATUS,
    isAnimating: false
  };
  var rafId = null;
  var pauseId = null;
  var dynGroup = null;

  // ---------- DOM 참조 ----------
  var $ = function (id) { return document.getElementById(id); };
  var shapeBtns = $('shapeBtns'), drawBar = $('drawBar'), drawMsg = $('drawMsg');
  var finishBtn = $('finishBtn'), clearBtn = $('clearBtn');
  var panels = $('panels'), panelL = $('panelL'), panelR = $('panelR');
  var svgL = $('svgL'), svgR = $('svgR');
  var dirBtns = $('dirBtns'), distBtns = $('distBtns');
  var actionBtn = $('actionBtn'), resetBtn = $('resetBtn'), statusEl = $('status');

  [svgL, svgR].forEach(function (s) {
    s.setAttribute('viewBox', '0 0 ' + SVG_SIZE + ' ' + SVG_SIZE);
  });

  // ---------- 헬퍼 ----------
  function S(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function dirOf(key) { return DIRS.filter(function (d) { return d.key === key; })[0]; }
  function startPoint() {
    return state.pointName === DRAW ? state.customPoint : PRESETS[state.pointName];
  }
  function hasPoint() {
    var unfinished = state.pointName === DRAW && state.drawingMode;
    return !!startPoint() && !unfinished;
  }
  function curPoint() {
    return state.segs.length > 0 ? state.cur : startPoint();
  }
  // 격자 밖으로 나가지 않고 갈 수 있는 최대 칸 수
  function maxDist(key) {
    var p = curPoint();
    if (!p) return GRID_SIZE;
    if (key === 'right') return GRID_SIZE - p.x;
    if (key === 'left') return p.x;
    if (key === 'up') return p.y;
    return GRID_SIZE - p.y;
  }
  function clampDist() {
    var m = maxDist(state.direction);
    if (hasPoint() && m >= 1 && state.dist > m) state.dist = m;
  }
  // 선택한 방향으로 더 못 가게 되면 갈 수 있는 다른 방향으로 자동 전환
  function ensureValidDirection() {
    if (!hasPoint()) return;
    if (maxDist(state.direction) >= 1) return;
    for (var i = 0; i < DIRS.length; i++) {
      if (maxDist(DIRS[i].key) >= 1) { state.direction = DIRS[i].key; return; }
    }
  }
  function canMove() {
    var m = maxDist(state.direction);
    return hasPoint() && !state.isAnimating && !state.drawingMode && m >= 1 && state.dist <= m;
  }
  // 처음 점 ㄱ에서 현재 점 ㄴ까지 얼마나 떨어져 있는지
  function netText() {
    var a = startPoint(), c = curPoint();
    var dx = c.x - a.x, dy = c.y - a.y, parts = [];
    if (dx > 0) parts.push('오른쪽 ' + dx + '칸');
    if (dx < 0) parts.push('왼쪽 ' + (-dx) + '칸');
    if (dy > 0) parts.push('아래쪽 ' + dy + '칸');
    if (dy < 0) parts.push('위쪽 ' + (-dy) + '칸');
    if (!parts.length) return '처음 자리(ㄱ)로 돌아왔어요!';
    return 'ㄱ에서 ' + parts.join(', ') + ' 떨어진 곳(ㄴ)이에요.';
  }

  // ---------- 그리기 요소 ----------
  function drawGrid(parent) {
    var g = S('g', {}, parent);
    for (var i = 0; i <= GRID_SIZE; i++) {
      var a = toPx({ x: i, y: 0 }), b = toPx({ x: i, y: GRID_SIZE });
      S('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: '#E4DFD3', 'stroke-width': 1 }, g);
      var c = toPx({ x: 0, y: i }), d = toPx({ x: GRID_SIZE, y: i });
      S('line', { x1: c.x, y1: c.y, x2: d.x, y2: d.y, stroke: '#E4DFD3', 'stroke-width': 1 }, g);
    }
  }
  // 글자 뒤에 흰 테두리를 깔아 격자선 위에서도 잘 보이게 (paint-order 미지원 브라우저 대비)
  function haloText(parent, attrs, content) {
    var halo = {};
    for (var k in attrs) halo[k] = attrs[k];
    halo.fill = '#fff'; halo.stroke = '#fff'; halo['stroke-width'] = 4; halo['stroke-linejoin'] = 'round';
    S('text', halo, parent).textContent = content;
    S('text', attrs, parent).textContent = content;
  }
  function drawPointMark(parent, p, color, label, ghost) {
    var q = toPx(p);
    var g = S('g', {}, parent);
    if (ghost) {
      S('circle', { cx: q.x, cy: q.y, r: 8, fill: '#fff', 'fill-opacity': 0.6, stroke: '#8A8578', 'stroke-width': 2, 'stroke-dasharray': '3 3' }, g);
    } else {
      S('circle', { cx: q.x, cy: q.y, r: 8, fill: color, stroke: '#fff', 'stroke-width': 2 }, g);
    }
    if (label) {
      var left = q.x > SVG_SIZE - 44, below = q.y < 44;
      haloText(g, {
        x: left ? q.x - 13 : q.x + 13, y: below ? q.y + 21 : q.y - 11,
        'text-anchor': left ? 'end' : 'start', 'font-size': 17, 'font-weight': 800,
        fill: ghost ? '#6B6459' : color, 'font-family': 'sans-serif'
      }, label);
    }
  }
  // 이동한 거리를 보여주는 화살표와 "3칸" 글자
  function drawSegArrow(parent, a, b, cells) {
    var p0 = toPx(a), p1 = toPx(b);
    var dx = p1.x - p0.x, dy = p1.y - p0.y;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 8) return;
    var ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
    var hl = Math.min(14, len * 0.6);
    var bx = p1.x - ux * hl, by = p1.y - uy * hl;
    var color = '#F2984B';
    var g = S('g', {}, parent);
    S('line', { x1: p0.x, y1: p0.y, x2: bx, y2: by, stroke: color, 'stroke-width': 3, 'stroke-linecap': 'round' }, g);
    S('polygon', {
      points: p1.x + ',' + p1.y + ' ' + (bx + nx * 7) + ',' + (by + ny * 7) + ' ' + (bx - nx * 7) + ',' + (by - ny * 7),
      fill: color
    }, g);
    var mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2;
    var horizontal = Math.abs(dx) >= Math.abs(dy);
    haloText(g, {
      x: horizontal ? mx : mx + 12, y: horizontal ? my - 10 : my + 5,
      'text-anchor': horizontal ? 'middle' : 'start',
      'font-size': 15, 'font-weight': 800, fill: '#C1622D', 'font-family': 'sans-serif'
    }, Math.max(1, Math.ceil(cells - 0.001)) + '칸');
  }

  // ---------- 렌더링 ----------
  function renderShapeButtons() {
    shapeBtns.textContent = '';
    Object.keys(PRESETS).forEach(function (name) {
      var b = document.createElement('button');
      b.className = 'btn pill' + (state.pointName === name ? ' on-green' : '');
      b.textContent = name;
      b.addEventListener('click', function () { selectPoint(name); });
      shapeBtns.appendChild(b);
    });
    var d = document.createElement('button');
    d.className = 'btn pill' + (state.pointName === DRAW ? ' on-orange' : '');
    d.textContent = '✏️ 직접 찍기';
    d.addEventListener('click', startDrawing);
    shapeBtns.appendChild(d);
  }

  function renderDrawBar() {
    var show = state.pointName === DRAW;
    drawBar.hidden = !show;
    // 찍는 중에는 CSS로 조작 버튼을 숨겨 작은 화면에서 격자판을 넓게 씀
    var root = document.documentElement;
    var cls = ' ' + root.className + ' ';
    var active = show && state.drawingMode;
    cls = cls.replace(' drawing-active ', ' ');
    root.className = (cls + (active ? 'drawing-active' : '')).replace(/^\s+|\s+$/g, '');
    if (!show) return;
    if (state.drawingMode) {
      drawMsg.textContent = state.customPoint
        ? '점이 찍혔어요. 다른 자리를 누르면 옮길 수 있어요. 정했으면 "점 완성"을 눌러요.'
        : '왼쪽 모눈판에서 점을 찍을 자리를 눌러보세요.';
    } else {
      drawMsg.textContent = '점이 완성되었습니다. 이동을 진행해보세요.';
    }
    finishBtn.disabled = !(state.drawingMode && state.customPoint);
  }

  function renderPanels() {
    svgL.textContent = '';
    svgR.textContent = '';
    var has = hasPoint();
    var sp = startPoint();

    // 이동 전 (왼쪽)
    drawGrid(svgL);
    if (has) drawPointMark(svgL, sp, '#1F4B3F', 'ㄱ', false);
    if (state.pointName === DRAW && state.drawingMode && sp) {
      var q = toPx(sp);
      S('circle', { cx: q.x, cy: q.y, r: 7, fill: '#C1622D', stroke: '#fff', 'stroke-width': 2 }, svgL);
    }
    var drawable = state.pointName === DRAW && state.drawingMode;
    svgL.style.touchAction = drawable ? 'none' : 'manipulation';
    svgL.style.cursor = drawable ? 'crosshair' : 'default';

    // 이동 후 (오른쪽)
    drawGrid(svgR);
    dynGroup = null;
    if (has) {
      drawPointMark(svgR, sp, '#8A8578', 'ㄱ', true);   // 처음 자리는 점선 동그라미로 남김
      dynGroup = S('g', {}, svgR);
    }
    updateDynamic();
  }

  // 이동 중 매 프레임 다시 그리는 부분 (지나온 길, 진행 중인 화살표, 현재 점)
  function updateDynamic() {
    if (!dynGroup) return;
    dynGroup.textContent = '';
    if (!hasPoint()) return;
    var pos = curPoint();
    state.segs.forEach(function (s) {
      drawSegArrow(dynGroup, s.from, s.to, s.dist);
    });
    state.segs.forEach(function (s) {
      var q = toPx(s.to);
      S('circle', { cx: q.x, cy: q.y, r: 4, fill: '#F2984B' }, dynGroup);
    });
    if (state.anim) {
      var f = state.anim.from, d = state.anim.d;
      pos = { x: f.x + d.dx * state.moved, y: f.y + d.dy * state.moved };
      drawSegArrow(dynGroup, f, pos, state.moved);
    }
    var moved = state.segs.length > 0 || !!state.anim;
    drawPointMark(dynGroup, pos, '#C1622D', moved ? 'ㄴ' : '', false);
  }

  function renderControls() {
    var max = maxDist(state.direction);
    Array.prototype.forEach.call(dirBtns.children, function (b, i) {
      b.className = 'btn' + (state.direction === DIRS[i].key ? ' on-green' : '');
      b.disabled = hasPoint() && maxDist(DIRS[i].key) < 1;
    });
    Array.prototype.forEach.call(distBtns.children, function (b, i) {
      var d = DISTS[i];
      b.className = 'btn' + (state.dist === d ? ' on-orange' : '');
      b.disabled = hasPoint() && d > max;
    });
    actionBtn.disabled = !canMove();
  }

  function renderStatus() { statusEl.textContent = state.status; }

  function render() {
    ensureValidDirection();
    clampDist();
    renderShapeButtons();
    renderDrawBar();
    renderPanels();
    renderControls();
    renderStatus();
    layoutPanels();
  }

  // ---------- 동작 ----------
  function handleGridClick(e) {
    if (state.pointName !== DRAW || !state.drawingMode) return;
    // 테두리(2px)와 화면 배율을 직접 보정해 viewBox 좌표로 변환 (브라우저별 getScreenCTM 차이 방지)
    var rect = svgL.getBoundingClientRect();
    var inner = rect.width - 4;
    if (inner <= 0) return;
    var p = {
      x: (e.clientX - rect.left - 2) * SVG_SIZE / inner,
      y: (e.clientY - rect.top - 2) * SVG_SIZE / inner
    };
    var gx = Math.round((p.x - PAD) / CELL);
    var gy = Math.round((p.y - PAD) / CELL);
    if (gx < 0 || gx > GRID_SIZE || gy < 0 || gy > GRID_SIZE) return;
    state.customPoint = { x: gx, y: gy };
    renderDrawBar();
    renderPanels();
    renderControls();
    layoutPanels();
  }

  // 한 칸(from → to)을 부드럽게 이동
  function animateSegment(from, to, duration, onDone) {
    var start = performance.now();
    function tick(now) {
      var t = Math.min(1, (now - start) / duration);
      var eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      state.moved = from + (to - from) * eased;
      updateDynamic();
      if (t < 1) {
        rafId = requestAnimationFrame(tick);
      } else {
        state.moved = to;
        updateDynamic();
        onDone();
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  function startMove() {
    if (!canMove()) return;
    var d = dirOf(state.direction);
    var total = state.dist;
    var cp = curPoint();
    var from = { x: cp.x, y: cp.y };
    state.isAnimating = true;
    state.moved = 0;
    state.anim = { from: from, d: d };
    renderControls();

    var step = 0;
    function doStep() {
      step += 1;
      state.status = d.name + '으로 ' + step + '칸 이동 중... (' + step + '/' + total + '칸)';
      renderStatus();
      animateSegment(step - 1, step, 450, function () {
        if (step < total) {
          pauseId = setTimeout(doStep, 100);
        } else {
          var to = { x: from.x + d.dx * total, y: from.y + d.dy * total };
          state.segs.push({ from: from, to: to, dist: total });
          state.cur = to;
          state.anim = null;
          state.moved = 0;
          state.isAnimating = false;
          state.status = d.name + '으로 ' + total + '칸 이동했습니다. ' + netText();
          ensureValidDirection();
          clampDist();
          renderPanels();
          renderControls();
          renderStatus();
        }
      });
    }
    doStep();
  }

  function reset() {
    if (rafId) cancelAnimationFrame(rafId);
    if (pauseId) clearTimeout(pauseId);
    state.isAnimating = false;
    state.segs = [];
    state.cur = null;
    state.anim = null;
    state.moved = 0;
    state.status = DEFAULT_STATUS;
  }

  function selectPoint(name) {
    reset();
    state.pointName = name;
    state.drawingMode = false;
    render();
  }
  function startDrawing() {
    reset();
    state.pointName = DRAW;
    state.customPoint = null;
    state.drawingMode = true;
    render();
  }
  function finishDrawing() {
    if (state.customPoint) {
      state.drawingMode = false;
      render();
    }
  }
  function clearDrawing() {
    reset();
    state.customPoint = null;
    state.drawingMode = true;
    render();
  }

  // ---------- 화면 크기에 맞춰 두 격자판 크기 계산 (아이폰 주소창 변화 대응) ----------
  function layoutPanels() {
    var w = panels.clientWidth;
    var h = panels.clientHeight;
    var gap = w < 600 ? 8 : 20;
    var side = Math.floor(Math.max(48, Math.min((w - gap) / 2, h - 24, 480)));
    panels.style.gap = gap + 'px';
    panelR.style.marginLeft = document.documentElement.className.indexOf('no-flex-gap') >= 0 ? gap + 'px' : '';
    [[panelL, svgL], [panelR, svgR]].forEach(function (pair) {
      pair[0].style.width = side + 'px';
      pair[1].setAttribute('width', side);
      pair[1].setAttribute('height', side);
    });
  }

  // ---------- 초기화 ----------
  DIRS.forEach(function (d) {
    var b = document.createElement('button');
    b.textContent = d.label;
    b.style.minWidth = '84px';
    b.addEventListener('click', function () {
      state.direction = d.key;
      clampDist();
      renderControls();
    });
    dirBtns.appendChild(b);
  });
  DISTS.forEach(function (n) {
    var b = document.createElement('button');
    b.textContent = n + '칸';
    b.style.minWidth = '56px';
    b.addEventListener('click', function () { state.dist = n; renderControls(); });
    distBtns.appendChild(b);
  });

  svgL.addEventListener('click', handleGridClick);
  finishBtn.addEventListener('click', finishDrawing);
  clearBtn.addEventListener('click', clearDrawing);
  actionBtn.addEventListener('click', startMove);
  resetBtn.addEventListener('click', function () { reset(); render(); });

  window.addEventListener('resize', layoutPanels);
  window.addEventListener('orientationchange', layoutPanels);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layoutPanels);
  if (window.ResizeObserver) new ResizeObserver(layoutPanels).observe(panels);

  render();
})();

</script>
</body>
</html>
